# Pages CMS (app.pagescms.org) editor for content.json.
# Each save is a commit to main, which rebuilds aexomir.me and updates the iPhone app.
# Keep these fields in step with the checks in scripts/build.mjs.

# Buttons in the Pages CMS sidebar. Each runs a workflow in .github/workflows/.
actions:
  - name: deploy-site
    label: Deploy site
    workflow: pages.yml
    ref: main
  - name: publish-app-update
    label: Publish app update
    workflow: app-update.yml
    ref: main
    fields:
      - { name: message, label: What changed, type: string, required: true }
  - name: build-testflight
    label: Build for TestFlight
    workflow: app-testflight.yml
    ref: main

content:
  - name: site
    label: Site content
    type: file
    path: content.json
    format: json
    fields:
      - name: profile
        label: Profile
        type: object
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: title, label: Title, type: string, required: true, description: "Small line above the name, also used in the page title." }
          - { name: description, label: Search and share description, type: text, required: true, description: "Shown by Google and in link previews." }
          - { name: intro, label: Intro, type: text, required: true, description: "The paragraph under the name on the home page." }
          - { name: currently, label: Currently, type: string, required: true }
          - { name: city, label: City, type: string, required: true, description: "Used by the iPhone app's live clock." }
          - { name: timeZone, label: Time zone, type: string, required: true, description: "IANA name, for example Europe/Rome." }
          - { name: status, label: Status, type: string, required: true, description: "Next to the green dot, for example \"Open to new roles\"." }

      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {type} · {year}"
        fields:
          - name: slug
            label: Slug
            type: string
            required: true
            pattern: { regex: "^[a-z0-9-]+$", message: "Lowercase letters, numbers and dashes only." }
            description: "Used in the app's project link. Must be unique; avoid changing it once published."
          - { name: name, label: Name, type: string, required: true }
          - name: type
            label: Type
            type: select
            required: true
            options:
              values: [Apps, Research, Open Source]
          - { name: year, label: Year, type: string, required: true, description: "Shown as written, for example 2026 or 2024 — 2025." }
          - { name: summary, label: Summary, type: text, required: true, description: "One or two sentences, shown in the list." }
          - name: repo
            label: GitHub link
            type: string
            pattern: { regex: "^(https://\\S+)?$", message: "Leave empty or use a full https:// link." }
          - name: paper
            label: Paper link
            type: string
            pattern: { regex: "^(https://\\S+)?$", message: "Leave empty or use a full https:// link." }
            description: "Optional, for research with a written paper."
          - name: facts
            label: Facts (app detail screen and case-study page)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
            fields:
              - { name: label, label: Label, type: string, required: true }
              - { name: value, label: Value, type: string, required: true }
          - name: caseStudy
            label: Case study
            type: object
            description: "Fill Problem, Approach, Key decisions and Results to publish a page at aexomir.me/projects/<slug>/, linked from the project list. Case studies read in list order, each pointing to the next. Leave them empty for no page. A blank line starts a new paragraph."
            fields:
              - { name: role, label: Role, type: string, description: "Optional. Your part and the team, for example \"Solo project\" or \"Course project · team of three\"." }
              - { name: problem, label: Problem, type: text }
              - { name: approach, label: Approach, type: text }
              - { name: decisions, label: Key decisions, type: text }
              - { name: results, label: Results, type: text, description: "Real numbers only." }
              - { name: retrospective, label: "What I'd do differently", type: text, description: "Optional." }
          - name: images
            label: Images (case-study page)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{src}"
            fields:
              - name: src
                label: File path
                type: string
                required: true
                pattern: { regex: "^assets/(?:[\\w-][\\w.-]*/)*[\\w-][\\w.-]*\\.(png|webp|svg)$", message: "A .png, .webp or .svg under assets/, for example assets/projects/chrona/timeline.png" }
                description: "The file must be committed to the repo at this path."
              - { name: alt, label: Alt text, type: string, required: true, description: "What the image shows, for people using screen readers." }
              - { name: caption, label: Caption, type: string }

      - name: experience
        label: Experience
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{years} · {role} · {company}"
        fields:
          - { name: years, label: Years, type: string, required: true, description: "For example 2022 — 2025 or 2025 — Now." }
          - { name: role, label: Role, type: string, required: true }
          - { name: company, label: Company, type: string, required: true }
          - { name: impact, label: Impact, type: text, description: "Optional. One or two sentences on what you changed, with numbers." }

      - name: certificates
        label: Certificates
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {year}"
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: issuer, label: Issuer, type: string, required: true }
          - { name: year, label: Year, type: string, required: true, description: "For example 2025 or In progress." }
          - name: url
            label: Link
            type: string
            pattern: { regex: "^(https://\\S+)?$", message: "Leave empty or use a full https:// link." }
            description: "GitHub links show as \"Repo\", others as \"Verify\"."

      - name: links
        label: Contact links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label} · {value}"
        fields:
          - { name: label, label: Label, type: string, required: true, description: "For example Email, GitHub, LinkedIn." }
          - { name: value, label: Shown as, type: string, required: true }
          - name: href
            label: Link
            type: string
            required: true
            pattern: { regex: "^(https://|mailto:)\\S+$", message: "Use https://… or mailto:…" }

      - name: app
        label: App status
        type: object
        description: "Only the iPhone app reads these. Changes reach it on its next launch or pull to refresh."
        fields:
          - name: maintenance
            label: Maintenance banner
            type: object
            fields:
              - { name: enabled, label: Show banner, type: boolean, default: false }
              - { name: message, label: Message, type: text, description: "Required while the banner is on." }
          - name: latestVersion
            label: Latest app version
            type: string
            pattern: { regex: "^(\\d+\\.\\d+\\.\\d+)?$", message: "Like 1.2.0" }
            description: "People on an older version see the update notice. The version is set in app.json."
          - { name: updateMessage, label: Update notice text, type: string }
          - name: updateUrl
            label: Update link
            type: string
            pattern: { regex: "^(https://\\S+)?$", message: "Leave empty or use a full https:// link." }
            description: "App Store or TestFlight link. Leave empty to show the notice without a button."
          - name: features
            label: Feature switches
            type: object
            fields:
              - { name: nameWave, label: Name wave animation, type: boolean, default: true }
              - { name: contactSheet, label: "Status opens the Get in touch sheet", type: boolean, default: true }
              - { name: liveClock, label: Live clock on Home, type: boolean, default: true }
